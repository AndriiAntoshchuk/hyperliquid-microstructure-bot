[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperliquid-microstructure-bot"
version = "0.1.0"
description = "Quantitative research and execution framework for Hyperliquid market microstructure."
requires-python = ">=3.11"
dependencies = ["requests>=2.32"]

[project.optional-dependencies]
dev = ["pytest>=8.0",]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

