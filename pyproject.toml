[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperliquid-microstructure-bot"
version = "0.1.0"
description = "Quantitative research and execution framework for Hyperliquid market microstructure."
requires-python = ">=3.11"
dependencies = ["requests>=2.32", "websockets>=15", "matplotlib>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "ruff>=0.7", "mypy>=1.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

