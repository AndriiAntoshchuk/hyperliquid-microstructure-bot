name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint existing repository
        run: ruff check . --select F
      - name: Strict lint of new modules and tests
        run: |
          ruff check src/hlbot/data/buffered_writer.py src/hlbot/data/hyperliquid_ws_paths.py src/hlbot/backtest/demo_workflow.py src/hlbot/strategy/demo_signal.py src/hlbot/__main__.py scripts/benchmark_writer.py scripts/generate_demo_data.py tests/integration/ tests/unit/test_position_context_builder.py --select E4,E7,E9,F,B
      - name: Type check new modules (gradual adoption)
        run: mypy --follow-imports=skip --ignore-missing-imports src/hlbot/data/buffered_writer.py src/hlbot/data/hyperliquid_ws_paths.py src/hlbot/strategy/demo_signal.py src/hlbot/backtest/demo_workflow.py src/hlbot/__main__.py
      - name: Compile source
        run: python -m compileall -q src scripts
      - name: Test with branch coverage
        run: pytest -q --cov=hlbot --cov-branch --cov-report=term-missing --cov-fail-under=80
      - name: Reproduce sample replay
        run: python -m hlbot backtest --config configs/demo_backtest.json --data data/sample --output reports/demo_backtest.json
      - name: Check benchmark equivalence
        run: python scripts/benchmark_writer.py --records 1000
