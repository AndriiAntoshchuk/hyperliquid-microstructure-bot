services:
  collector:
    build:
      context: ../..
      dockerfile: deployment/ws-collector/Dockerfile
    image: hlbot-ws-collector:local
    init: true
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - >-
        exec python scripts/collect_hyperliquid_ws.py
        --coins $${COINS:-BTC}
        --data-dir /data/raw
        --queue-size $${QUEUE_SIZE:-4096}
        --batch-size $${BATCH_SIZE:-256}
        --flush-interval $${FLUSH_INTERVAL:-0.25}
    environment:
      COINS: ${COINS:-BTC}
      QUEUE_SIZE: ${QUEUE_SIZE:-4096}
      BATCH_SIZE: ${BATCH_SIZE:-256}
      FLUSH_INTERVAL: ${FLUSH_INTERVAL:-0.25}
      HEALTH_MAX_AGE_SECONDS: ${HEALTH_MAX_AGE_SECONDS:-300}
    volumes:
      - collector_data:/data
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "deployment/ws-collector/healthcheck.py", "--data-dir", "/data/raw"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  collector_data:
